<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Outer Fine Gold Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.4" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6" />

  <!-- Central Crest / Symbol -->
  <!-- Stylized Monogram S & C intertwined -->
  <g filter="url(#glow)">
    <!-- Crown or Crest ornament -->
    <path d="M196 150 L256 120 L316 150 L300 170 L256 160 L212 170 Z" fill="url(#gold)" />
    
    <!-- Stylized Feather Quill / Sword of Intellect -->
    <path d="M256 170 C240 220 230 290 256 370 C282 290 272 220 256 170 Z" fill="none" stroke="url(#gold)" stroke-width="4" />
    <line x1="256" y1="170" x2="256" y2="385" stroke="url(#gold)" stroke-width="2" />
    <circle cx="256" cy="390" r="4" fill="url(#gold)" />

    <!-- Letter S Arc -->
    <path d="M220 225 C200 210 200 190 230 185 C270 180 280 220 235 245 C190 270 200 320 250 320 C275 320 290 305 295 285" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Letter C Arc -->
    <path d="M305 225 C295 210 270 195 240 200 M240 310 C280 315 315 295 320 260" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Stars -->
  <circle cx="160" cy="256" r="3" fill="url(#gold)" />
  <circle cx="352" cy="256" r="3" fill="url(#gold)" />
</svg>
